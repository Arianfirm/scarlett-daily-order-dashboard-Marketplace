name: Update Scarlett Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests openpyxl

      - name: Run Dashboard Update
        env:
          ACHANTO_EMAIL:    ${{ secrets.ACHANTO_EMAIL }}
          ACHANTO_PASSWORD: ${{ secrets.ACHANTO_PASSWORD }}
        run: python update_dashboard.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch remote FIRST before anything
          git fetch origin main

          # Set aside the freshly-generated data/ changes, then hard-sync the working
          # tree to the true tip of origin/main — this picks up any developer commit
          # that landed on non-data files (index.html, etc.) while this job was running —
          # before re-applying only the data/ changes on top. This is what prevents
          # non-data files from ever being committed with stale content.
          git stash push --include-untracked -- data/
          git reset --hard origin/main
          if [ -n "$(git stash list)" ]; then
            git stash pop
          fi

          # Stage only data files
          git add data/

          # Nothing changed? done.
          git diff --staged --quiet && { echo "No changes."; exit 0; }

          git commit -m "chore: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
