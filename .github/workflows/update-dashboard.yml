name: Update Scarlett Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests openpyxl

      - name: Run Dashboard Update
        env:
          ACHANTO_EMAIL:    ${{ secrets.ACHANTO_EMAIL }}
          ACHANTO_PASSWORD: ${{ secrets.ACHANTO_PASSWORD }}
        run: python update_dashboard.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
